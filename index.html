<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주성치와 함께하는 디자인 여행</title>
<link rel="icon" type="image/png" href="assets/dssync.png">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- Sidebar: project selector -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <img src="assets/keyvisual.png" alt="" class="sidebar-keyvisual" onclick="openModal('modal-image')">
      <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="사이드바 접기">‹</button>
    </div>
    <nav id="sidebar-projects"></nav>
    <div id="sidebar-skills-btn" class="sidebar-skills-btn" onclick="openSkillLibrary()" title="스킬 도서관">
      <span class="sidebar-skills-icon">📚</span>
      <span class="sidebar-skills-label">스킬 도서관</span>
    </div>
  </aside>

  <!-- Main area -->
  <div id="main">
    <!-- Top bar -->
    <div id="topbar">
      <div class="topbar-left">
        <span id="topbar-project" class="topbar-project-name"></span>
      </div>
      <div class="topbar-center" id="topbar-stats"></div>
      <div class="topbar-right">
        <button class="topbar-btn" onclick="openDrawer('timeline')" title="광역 타임라인 — 모든 프로젝트·작업의 전체 대화를 시간순으로">광역 타임라인</button>
        <div class="topbar-divider"></div>
        <button class="topbar-btn icon-btn" onclick="openDsSyncModal()" title="무적풍화륜">
          <img src="assets/dssync.png" style="width:16px;height:16px;image-rendering:pixelated">
          <span class="topbar-sync-time" id="dssync-last-at">—</span>
        </button>
        <button class="topbar-btn icon-btn" onclick="openScreenSyncModal()" title="이혼대법">
          <img src="assets/screensync.png" style="width:16px;height:16px;image-rendering:pixelated">
          <span class="topbar-sync-time" id="screensync-last-at">—</span>
        </button>
      </div>
    </div>

    <!-- Content: two-column -->
    <div id="content">
      <!-- Left: Work Queue -->
      <div id="work-queue">
        <div class="panel-header">
          <span class="panel-title" id="work-queue-title">작업</span>
          <span class="panel-count" id="work-queue-count"></span>
        </div>
        <div id="work-list"></div>
      </div>

      <div id="wq-resize-handle"></div>

      <!-- Right: Work Detail -->
      <div id="work-detail">
        <div id="work-detail-inner"></div>
      </div>
    </div>
  </div>
</div>

<!-- Drawer backdrop -->
<div id="drawer-backdrop" onclick="closeDrawer()"></div>

<!-- Drawer panel -->
<div id="drawer-panel">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title"></span>
    <button class="modal-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<!-- Splash -->
<div id="splash">
  <img src="assets/keyvisual.png" alt="">
  <div id="splash-title">주성치와 함께하는<br>디자인 여행</div>
</div>

<!-- Modal: Agent Detail -->
<div class="modal-backdrop" id="modal-agent">
  <button class="modal-nav modal-nav-prev" id="modal-agent-prev" onclick="navigateAttempt(-1)" title="이전 회차" hidden>‹</button>
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-agent-title">—</div>
      <button class="modal-close" onclick="closeModal('modal-agent')">✕</button>
    </div>
    <div class="modal-body" id="modal-agent-body"></div>
    <div class="modal-attempt-dots" id="modal-agent-dots" hidden></div>
  </div>
  <button class="modal-nav modal-nav-next" id="modal-agent-next" onclick="navigateAttempt(1)" title="다음 회차" hidden>›</button>
</div>

<!-- Modal: Log Detail -->
<div class="modal-backdrop" id="modal-log">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">실행 로그 전체</div>
      <button class="modal-close" onclick="closeModal('modal-log')">✕</button>
    </div>
    <div class="modal-body" id="modal-log-body"></div>
  </div>
</div>

<!-- Modal: Builder Result -->
<div class="modal-backdrop" id="modal-builder">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><img class="modal-agent-icon" src="assets/builder.png" alt="figma-builder"> figma-builder</div>
      <button class="modal-close" onclick="closeModal('modal-builder')">✕</button>
    </div>
    <div class="modal-body" id="modal-builder-body"></div>
  </div>
</div>


<!-- Modal: Director Notes -->
<div class="modal-backdrop" id="modal-director">
  <div class="modal" style="width:700px;max-width:calc(100vw - 40px)">
    <div class="modal-header">
      <div class="modal-title">
        <img src="assets/director.png" alt="director" style="width:20px;height:20px;image-rendering:pixelated;flex-shrink:0;">
        <span id="modal-director-title">director</span>
      </div>
      <button class="modal-close" onclick="closeModal('modal-director')">✕</button>
    </div>
    <div class="modal-body" id="modal-director-body"></div>
  </div>
</div>

<!-- Modal: DS Sync -->
<div class="modal-backdrop" id="modal-dssync">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="modal-title">
          <img src="assets/dssync.png" alt="ds-sync" style="width:20px;height:20px;image-rendering:pixelated;flex-shrink:0;">
          무적풍화륜 실행 내역
        </div>
        <div class="modal-desc">Figma 디자인 시스템(변수·컴포넌트)을 수집해 project/docs에 동기화합니다.</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-dssync')">✕</button>
    </div>
    <div class="modal-body" id="modal-dssync-body"></div>
  </div>
</div>

<!-- Modal: Screen Sync -->
<div class="modal-backdrop" id="modal-screensync">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="modal-title">
          <img src="assets/screensync.png" alt="screen-sync" style="width:20px;height:20px;image-rendering:pixelated;flex-shrink:0;">
          이혼대법 실행 내역
        </div>
        <div class="modal-desc">Figma screen 페이지를 스캔해 디자이너 작업 스타일·판단 기준을 project/docs에 누적합니다.</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-screensync')">✕</button>
    </div>
    <div class="modal-body" id="modal-screensync-body"></div>
  </div>
</div>


<!-- Modal: Image -->
<div class="modal-backdrop" id="modal-image" onclick="closeModal('modal-image')">
  <img src="assets/keyvisual.png" style="max-width:90vw;max-height:90vh;border-radius:8px;" alt="">
</div>

<script src="app.js"></script>
</body>
</html>
